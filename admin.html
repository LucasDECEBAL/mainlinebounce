<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Main Line Bounce</title>

  <!-- ✅ Site theme -->
  <link rel="stylesheet" href="css/style.css">

  <!-- SheetJS : génération du fichier Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
  /* ===== ADMIN — matches the Main Line Bounce theme ===== */
  .admin-wrap{
    max-width: 980px;
    margin: 48px auto 80px;
    padding: 0 28px;
  }

  .admin-head{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
  }

  .admin-head h1{
    font-size: 1.7rem;
    font-weight: 800;
    color: var(--color-dark);
    margin: 0;
  }

  .logout-btn{
    background: #fff;
    border: 2px solid var(--color-dark);
    color: var(--color-dark);
    padding: 8px 18px;
    border-radius: var(--radius-pill);
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
  }

  .box{
    background: var(--color-white);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: 32px 30px;
    margin-bottom: 24px;
  }

  .box h3{
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--color-dark);
    margin-bottom: 14px;
  }

  label{
    display: block;
    margin: 14px 0 6px;
    font-weight: 600;
    font-size: 0.93rem;
    color: var(--color-dark);
  }

  input[type="password"],
  input[type="date"],
  input[type="datetime-local"],
  input[type="text"],
  input[type="number"],
  select,
  textarea{
    width: 100%;
    padding: 12px 14px;
    border: 2px solid var(--color-pink-pale);
    border-radius: 12px;
    font-size: 0.95rem;
    font-family: 'Poppins', sans-serif;
    color: var(--color-dark);
    background: var(--color-white);
    box-sizing: border-box;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  textarea{ resize: vertical; }

  input:focus, select:focus, textarea:focus{
    outline: none;
    border-color: var(--color-pink);
    box-shadow: 0 0 0 3px rgba(245,106,155,0.15);
  }

  .check-row{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    font-weight: 600;
    font-size: 0.93rem;
  }
  .check-row input{ width: auto; }

  .block-btn,
  .unblock-btn{
    width: 100%;
    margin-top: 16px;
    padding: 14px 32px;
    border: none;
    border-radius: var(--radius-pill);
    font-family: 'Poppins', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
  }
  .block-btn:hover,
  .unblock-btn:hover{ transform: translateY(-2px); }

  .block-btn{
    background: var(--color-pink);
    box-shadow: 0 6px 20px rgba(245,106,155,0.35);
  }
  .block-btn:hover{
    background: var(--color-pink-hover);
    box-shadow: 0 8px 24px rgba(245,106,155,0.45);
  }

  .unblock-btn{
    background: var(--color-orange);
    box-shadow: 0 6px 20px rgba(245,148,74,0.35);
  }
  .unblock-btn:hover{
    background: var(--color-orange-hover);
    box-shadow: 0 8px 24px rgba(245,148,74,0.45);
  }

  .status{
    text-align: center;
    margin-top: 14px;
    font-weight: 700;
    font-size: 0.9rem;
    min-height: 20px;
  }

  .list{ font-size: 0.92rem; color: var(--color-dark); }
  .list h4{
    margin: 16px 0 6px;
    font-size: 0.95rem;
    color: var(--color-dark);
  }
  .list ul{ margin: 4px 0; padding-left: 0; }
  .list li{
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--color-pink-pale);
    color: var(--color-pink);
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 10px;
    margin: 8px 0;
  }
  .list li::before{ content: "📅"; }

  /* Tabs */
  .tabs{
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .tab{
    background: #fff;
    border: 2px solid var(--color-pink-pale);
    color: var(--color-dark);
    padding: 10px 20px;
    border-radius: var(--radius-pill);
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 0.88rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .tab.active{
    background: var(--color-pink);
    border-color: var(--color-pink);
    color: #fff;
  }

  /* Banners */
  .banner-editor{
    border: 2px solid var(--color-pink-pale);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .banner-editor h4{
    margin: 0 0 4px;
    font-size: 1rem;
    color: var(--color-dark);
  }

  /* Products table */
  .articles-table{
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
    margin-bottom: 8px;
  }
  .articles-table th,
  .articles-table td{
    text-align: left;
    padding: 10px 8px;
    border-bottom: 1px solid #eee;
    vertical-align: middle;
  }
  .articles-table th{
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--color-gray);
  }
  .articles-table .tag{
    display: inline-block;
    padding: 3px 10px;
    border-radius: 50px;
    background: var(--color-pink-pale);
    color: var(--color-pink);
    font-weight: 700;
    font-size: 0.75rem;
  }
  .articles-table .tag.off{
    background: #f0f0f0;
    color: var(--color-gray);
  }
  .row-btn{
    border: none;
    background: none;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 0.82rem;
    padding: 4px 8px;
    text-decoration: underline;
  }
  .row-btn.edit{ color: var(--color-dark); }
  .row-btn.del{ color: #e63329; }

  /* Add-on checkboxes */
  .addons-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 8px;
  }
  .addon-check{
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--color-pink-pale);
    border-radius: 10px;
    padding: 10px 12px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .addon-check input{ width: auto; }
  .addon-check.disabled{ opacity: 0.45; }

  .form-actions{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  /* Bookings */
  .bookings-toolbar{
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .bookings-toolbar input{
    flex: 1;
    min-width: 200px;
    margin: 0;
  }
  .bookings-toolbar select{
    width: auto;
    margin: 0;
    padding: 10px 14px;
  }
  .toolbar-btn{
    background: #fff;
    border: 2px solid var(--color-pink-pale);
    border-radius: var(--radius-pill);
    padding: 10px 18px;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    color: var(--color-dark);
    transition: all 0.2s ease;
  }
  .toolbar-btn:hover{
    border-color: var(--color-pink);
  }
  .toolbar-btn.primary{
    background: var(--color-pink);
    border-color: var(--color-pink);
    color: #fff;
  }
  .table-scroll{
    overflow-x: auto;
  }
  .bookings-summary{
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--color-gray);
    margin-bottom: 10px;
  }
  .bookings-table th:first-child,
  .bookings-table td:first-child{
    width: 28px;
    padding-right: 0;
  }
  .booking-row-check,
  #bookingSelectAll{
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: var(--color-pink);
  }
  .articles-table th.sortable{
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .articles-table th.sortable:hover{
    color: var(--color-pink);
  }
  .pay-tag{
    display: inline-block;
    padding: 3px 10px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 0.72rem;
    background: #e8f8ee;
    color: #1e8e4e;
  }
  .pay-tag.onsite{
    background: #fff4e5;
    color: #b76a00;
  }

  @media (max-width: 720px){
    .addons-grid{ grid-template-columns: 1fr; }
    .articles-table th:nth-child(4),
    .articles-table td:nth-child(4){ display: none; }
  }

  @media (max-width: 600px){
    .admin-wrap{ padding: 0 18px; margin: 32px auto 60px; }
    .box{ padding: 26px 22px; }
    .admin-head h1{ font-size: 1.35rem; }
    .form-actions{ grid-template-columns: 1fr; }
  }
  </style>
</head>
<body>

  <div class="admin-wrap">
    <div class="admin-head">
      <h1>🔐 Main Line Bounce Admin</h1>
      <button class="logout-btn" id="logoutBtn" style="display:none;">Log out</button>
    </div>

    <!-- ================= LOGIN ================= -->
    <div class="box" id="loginBox">
      <label>Admin key</label>
      <input type="password" id="adminKey" placeholder="Your secret key">
      <button class="block-btn" id="loginBtn">Log in</button>
      <div class="status" id="loginStatus"></div>
    </div>

    <!-- ================= PANEL ================= -->
    <div id="panel" style="display:none;">

      <div class="tabs">
        <button class="tab active" data-tab="dates">📅 Blocked dates</button>
        <button class="tab" data-tab="bookings">📒 Bookings</button>
        <button class="tab" data-tab="banners">🖼️ Banners</button>
        <button class="tab" data-tab="faq">❓ FAQ</button>
        <button class="tab" data-tab="articles">🎈 Products</button>
      </div>

      <!-- ---------- DATES TAB ---------- -->
      <div class="tab-panel" id="tab-dates">
        <div class="box">
          <label>Inflatable</label>
          <select id="item">
            <option value="ALL">🌐 ALL inflatables (global block)</option>
          </select>

          <label>Date to block / unblock</label>
          <input type="date" id="date">

          <button class="block-btn" onclick="sendAction('block')">🚫 Block this date</button>
          <button class="unblock-btn" onclick="sendAction('unblock')">✅ Unblock this date</button>

          <div id="status" class="status"></div>
        </div>

        <div class="box">
          <h3>📅 Currently blocked dates</h3>
          <div class="list" id="blockedList">Loading...</div>
        </div>
      </div>

      <!-- ---------- BOOKINGS TAB ---------- -->
      <div class="tab-panel" id="tab-bookings" style="display:none;">
        <div class="box">
          <h3>Bookings</h3>
          <div class="bookings-toolbar">
            <input type="text" id="bookingsSearch" placeholder="Search name, email, phone, location…">
            <select id="bookingsPayment">
              <option value="all">All payments</option>
              <option value="paid">Paid online</option>
              <option value="onsite">Pay on site</option>
            </select>
            <button class="toolbar-btn" id="newBookingBtn">➕ New booking</button>
            <button class="toolbar-btn" id="refreshBookingsBtn">↻ Refresh</button>
            <button class="toolbar-btn primary" id="exportBookingsBtn">⬇ Export Excel</button>
          </div>
          <div class="bookings-summary" id="bookingsSummary"></div>
          <div class="table-scroll" id="bookingsTable"></div>
          <div class="status" id="bookingsStatus"></div>
        </div>

        <div class="box" id="bookingFormBox" style="display:none;">
          <h3 id="bookingFormTitle">Edit booking</h3>
          <input type="hidden" id="bk-id">

          <label>Booked at</label>
          <input type="datetime-local" id="bk-created">

          <label>Customer name</label>
          <input type="text" id="bk-name" maxlength="100">

          <label>Phone</label>
          <input type="text" id="bk-phone" maxlength="40">

          <label>Email</label>
          <input type="text" id="bk-email" maxlength="150">

          <label>Event date</label>
          <input type="date" id="bk-eventdate">

          <label>Address</label>
          <input type="text" id="bk-address" maxlength="200">

          <label>Location</label>
          <input type="text" id="bk-location" maxlength="100">

          <label>Guests</label>
          <input type="text" id="bk-guests" maxlength="20">

          <label>Items</label>
          <textarea id="bk-items" rows="3" maxlength="1000"></textarea>

          <label>Total ($)</label>
          <input type="number" id="bk-total" min="0" step="0.01">

          <label>Payment</label>
          <select id="bk-payment">
            <option value="paid">Paid online</option>
            <option value="pay_on_site">Pay on site</option>
          </select>

          <label>Comments</label>
          <textarea id="bk-comments" rows="3" maxlength="500"></textarea>

          <div class="form-actions">
            <button class="block-btn" id="saveBookingBtn" style="margin-top:8px;">💾 Save</button>
            <button class="unblock-btn" id="cancelBookingBtn" style="margin-top:8px;">Cancel</button>
          </div>
          <div class="status" id="bookingFormStatus"></div>
        </div>
      </div>

      <!-- ---------- BANNERS TAB ---------- -->
      <div class="tab-panel" id="tab-banners" style="display:none;">
        <div class="box">
          <h3>Banner per page</h3>
          <div id="bannersForm"></div>
          <button class="block-btn" id="saveBannersBtn">💾 Save banners</button>
          <div class="status" id="bannerStatus"></div>
        </div>
      </div>

      <!-- ---------- FAQ TAB ---------- -->
      <div class="tab-panel" id="tab-faq" style="display:none;">
        <div class="box">
          <h3>FAQ</h3>
          <div id="faqTable"></div>
          <button class="block-btn" id="newFaqBtn">➕ New question</button>
        </div>

        <div class="box" id="faqFormBox" style="display:none;">
          <h3 id="faqFormTitle">New question</h3>
          <input type="hidden" id="f-id">

          <label>Question</label>
          <input type="text" id="f-question" maxlength="300">

          <label>Answer</label>
          <textarea id="f-answer" rows="6" maxlength="3000"></textarea>

          <label>Position (1, 2, 3…)</label>
          <input type="number" id="f-position" min="1" max="99" value="1">

          <div class="form-actions">
            <button class="block-btn" id="saveFaqBtn" style="margin-top:8px;">💾 Save</button>
            <button class="unblock-btn" id="cancelFaqBtn" style="margin-top:8px;">Cancel</button>
          </div>
          <div class="status" id="faqStatus"></div>
        </div>
      </div>

      <!-- ---------- PRODUCTS TAB ---------- -->
      <div class="tab-panel" id="tab-articles" style="display:none;">
        <div class="box">
          <h3>Products</h3>
          <div id="articlesTable"></div>
          <button class="block-btn" id="newArticleBtn">➕ New product</button>
        </div>

        <div class="box" id="articleFormBox" style="display:none;">
          <h3 id="articleFormTitle">New product</h3>
          <input type="hidden" id="a-id">

          <label>Product name</label>
          <input type="text" id="a-name" maxlength="100">

          <label>Category (tile)</label>
          <select id="a-category">
            <option value="kids">Kids Party</option>
            <option value="teen">Teen &amp; Young Adult</option>
            <option value="corporate">Corporate &amp; Large Events</option>
          </select>

          <label>Price ($)</label>
          <input type="number" id="a-price" min="0" step="1">

          <label>Old price ($) — optional (strikethrough price)</label>
          <input type="number" id="a-oldprice" min="0" step="1">

          <label>Position on page (1, 2, 3…)</label>
          <input type="number" id="a-position" min="1" max="99" value="1">

          <label>Dimensions</label>
          <input type="text" id="a-dimension" maxlength="60" placeholder="e.g. 13 × 13 ft">

          <label>Short description</label>
          <input type="text" id="a-short" maxlength="300">

          <label>Long description</label>
          <textarea id="a-long" rows="5" maxlength="3000"></textarea>

          <label>Image (path)</label>
          <input type="text" id="a-image" maxlength="300" placeholder="images/my-product.png">

          <label>Badge (optional)</label>
          <input type="text" id="a-badge" maxlength="30" placeholder="LIMITED TIME">

          <label>Custom link (optional)</label>
          <input type="text" id="a-url" maxlength="300" placeholder="e.g. combo-special-2.html (otherwise auto product page)">

          <div class="check-row">
            <input type="checkbox" id="a-available" checked>
            <span>Product available (uncheck = unavailable)</span>
          </div>

          <label>Offered add-ons (max 6)</label>
          <div id="a-addons" class="addons-grid"></div>
          <div class="status" id="addonsCount"></div>

          <div class="form-actions">
            <button class="block-btn" id="saveArticleBtn" style="margin-top:8px;">💾 Save</button>
            <button class="unblock-btn" id="cancelArticleBtn" style="margin-top:8px;">Cancel</button>
          </div>
          <div class="status" id="articleStatus"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const API_DATES = "/.netlify/functions/blocked-dates";
    const API_CONTENT = "/.netlify/functions/site-content";

    let ITEM_NAMES = {
      "ALL": "🌐 All inflatables"
    };

    const BANNER_LABELS = {
      home: "Home",
      inflatables: "Inflatables",
      addons: "Add-ons",
      youngAdult: "Young Adult (Silent Disco)"
    };

    const CATEGORY_LABELS = {
      kids: "Kids",
      teen: "Teen",
      corporate: "Corporate"
    };

    let adminKey = sessionStorage.getItem("mlb_admin_key") || "";
    let content = null;

    /* ============================================
       LOGIN
       ============================================ */
    async function verifyKey(key) {
      const res = await fetch(API_CONTENT + "?verify=1", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-admin-key": key },
        body: "{}"
      });
      return res.ok;
    }

    async function login() {
      const key = document.getElementById("adminKey").value.trim();
      const status = document.getElementById("loginStatus");

      if (!key) {
        status.textContent = "❌ Enter your admin key";
        status.style.color = "#e63329";
        return;
      }

      status.textContent = "⏳ Checking...";
      status.style.color = "var(--color-gray)";

      try {
        if (!(await verifyKey(key))) {
          status.textContent = "❌ Invalid admin key";
          status.style.color = "#e63329";
          return;
        }
      } catch (e) {
        status.textContent = "❌ Network error";
        status.style.color = "#e63329";
        return;
      }

      adminKey = key;
      sessionStorage.setItem("mlb_admin_key", key);
      status.textContent = "";
      await enterPanel();
    }

    function logout() {
      sessionStorage.removeItem("mlb_admin_key");
      adminKey = "";
      document.getElementById("panel").style.display = "none";
      document.getElementById("loginBox").style.display = "block";
      document.getElementById("logoutBtn").style.display = "none";
      document.getElementById("adminKey").value = "";
    }

    async function enterPanel() {
      try {
        await loadContent();
      } catch (e) {
        document.getElementById("panel").style.display = "none";
        document.getElementById("loginBox").style.display = "block";
        document.getElementById("logoutBtn").style.display = "none";
        const status = document.getElementById("loginStatus");
        status.textContent = "❌ Backend unavailable — deploy to Netlify or run `netlify dev`";
        status.style.color = "#e63329";
        return;
      }

      document.getElementById("loginBox").style.display = "none";
      document.getElementById("panel").style.display = "block";
      document.getElementById("logoutBtn").style.display = "inline-block";

      renderBannersForm();
      renderFaqAdmin();
      renderArticles();
      renderItemOptions();
      loadBlocked();
      loadBookings();
    }

    /* ============================================
       CONTENT (banners + products)
       ============================================ */
    async function loadContent() {
      const res = await fetch(API_CONTENT, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      content = await res.json();
    }

    async function saveContent(statusEl, okMessage) {
      statusEl.textContent = "⏳ Saving...";
      statusEl.style.color = "var(--color-gray)";

      const res = await fetch(API_CONTENT, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-admin-key": adminKey },
        body: JSON.stringify(content)
      });

      if (res.status === 401) {
        logout();
        return false;
      }

      if (!res.ok) {
        let message = "Server error";
        try {
          const data = await res.json();
          message = data.error || message;
        } catch (e) {}
        statusEl.textContent = "❌ " + message;
        statusEl.style.color = "#e63329";
        return false;
      }

      content = await res.json();
      statusEl.textContent = "✅ " + okMessage;
      statusEl.style.color = "#27ae60";
      return true;
    }

    /* ============================================
       BANNERS
       ============================================ */
    function renderBannersForm() {
      const root = document.getElementById("bannersForm");

      root.innerHTML = Object.keys(BANNER_LABELS).map(function (key) {
        const b = (content.banners && content.banners[key]) || {};
        return (
          '<div class="banner-editor">' +
            "<h4>" + BANNER_LABELS[key] + "</h4>" +
            '<div class="check-row">' +
              '<input type="checkbox" id="b-' + key + '-enabled"' + (b.enabled ? " checked" : "") + ">" +
              "<span>Show banner</span>" +
            "</div>" +
            "<label>Small text (left)</label>" +
            '<input type="text" id="b-' + key + '-text" maxlength="80" value="' + escapeAttr(b.text || "") + '">' +
            "<label>Title (bold)</label>" +
            '<input type="text" id="b-' + key + '-title" maxlength="160" value="' + escapeAttr(b.title || "") + '">' +
            "<label>Sub-text</label>" +
            '<input type="text" id="b-' + key + '-sub" maxlength="160" value="' + escapeAttr(b.sub || "") + '">' +
            "<label>Button text</label>" +
            '<input type="text" id="b-' + key + '-cta" maxlength="30" value="' + escapeAttr(b.cta || "") + '">' +
            "<label>Button link</label>" +

    function refreshAddonLocks() {
      const boxes = Array.from(document.querySelectorAll('#a-addons input[type="checkbox"]'));
      const checked = boxes.filter(function (b) { return b.checked; });

      if (checked.length > 6) {
        checked[checked.length - 1].checked = false;
      }

      const count = boxes.filter(function (b) { return b.checked; }).length;
      boxes.forEach(function (b) {
        b.disabled = !b.checked && count >= 6;
        b.closest(".addon-check").classList.toggle("disabled", b.disabled);
      });

      document.getElementById("addonsCount").textContent = count + " / 6 selected";
      document.getElementById("addonsCount").style.color = "var(--color-gray)";

    async function saveArticle() {
      const status = document.getElementById("articleStatus");
      const name = document.getElementById("a-name").value.trim();
      const price = parseFloat(document.getElementById("a-price").value);

      if (!name) {
        status.textContent = "❌ Name is required";
        status.style.color = "#e63329";
        return;
      }
      if (!Number.isFinite(price) || price < 0) {
        status.textContent = "❌ Invalid price";
        status.style.color = "#e63329";
        return;
      }

      const oldPriceRaw = document.getElementById("a-oldprice").value;
      const oldPrice = oldPriceRaw === "" ? null : parseFloat(oldPriceRaw);

      const addons = Array.from(document.querySelectorAll('#a-addons input[type="checkbox"]:checked'))
        .map(function (b) { return b.value; })
        .slice(0, 6);

      const existingId = document.getElementById("a-id").value;
      const id = existingId || slugify(name) + "-" + Date.now().toString(36);

      const product = {
        id: id,
        name: name,
        category: document.getElementById("a-category").value,
        price: price,
        oldPrice: Number.isFinite(oldPrice) ? oldPrice : null,
        badge: document.getElementById("a-badge").value.trim(),
        shortDesc: document.getElementById("a-short").value.trim(),
        longDesc: document.getElementById("a-long").value.trim(),
        dimension: document.getElementById("a-dimension").value.trim(),
        image: document.getElementById("a-image").value.trim() || "images/placeholder.svg",
        position: parseInt(document.getElementById("a-position").value, 10) || 1,
        available: document.getElementById("a-available").checked,
        url: document.getElementById("a-url").value.trim(),
        addons: addons
      };

      const index = content.products.findIndex(function (p) { return p.id === id; });
      if (index >= 0) {
        content.products[index] = product;
      } else {
        content.products.push(product);
      }

      const ok = await saveContent(status, "Product saved");
      if (ok) {
        renderArticles();
        renderItemOptions();
        loadBlocked();
        openArticleForm(product.id);
        status.textContent = "✅ Product saved";
        status.style.color = "#27ae60";
      }
    }

          }).join("") +

    async function sendAction(action) {
      const status = document.getElementById("status");
      const key = adminKey;
      const date = document.getElementById("date").value;
      const item = document.getElementById("item").value;

      if (!key) { status.textContent = "❌ Enter your admin key"; status.style.color = "#e63329"; return; }
      if (!item) { status.textContent = "❌ Choose an inflatable"; status.style.color = "#e63329"; return; }
      if (!date) { status.textContent = "❌ Choose a date"; status.style.color = "#e63329"; return; }

      status.textContent = "⏳ Working...";
      status.style.color = "var(--color-gray)";

      try {
        const res = await fetch(API_DATES, {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-admin-key": key },
          body: JSON.stringify({ item: item, date: date, action: action })
        });

        if (res.status === 401) {
          status.textContent = "❌ Invalid admin key";
          status.style.color = "#e63329";
          return;
        }

        if (res.ok) {
          const label = ITEM_NAMES[item] || item;
          status.textContent = action === "block"
            ? "✅ Date blocked (" + label + "): " + date
            : "✅ Date unblocked (" + label + "): " + date;
          status.style.color = "#27ae60";
          loadBlocked();
        } else {
          status.textContent = "❌ Server error";
          status.style.color = "#e63329";
        }
      } catch (e) {
        status.textContent = "❌ Network error";
        status.style.color = "#e63329";
      }
    }

    async function loadBlocked() {
      const list = document.getElementById("blockedList");
      try {
        const res = await fetch(API_DATES);
        const data = await res.json();

        const keys = Object.keys(data).filter(function (k) { return (data[k] || []).length > 0; });
        if (keys.length === 0) {
          list.textContent = "No blocked dates.";
          return;
        }

        let html = "";
        const ordered = keys.sort(function (a, b) {
          return a === "ALL" ? -1 : b === "ALL" ? 1 : a.localeCompare(b);
        });

        for (const key of ordered) {
          const dates = (data[key] || []).sort();
          if (dates.length === 0) continue;
          const label = ITEM_NAMES[key] || key;
          html += "<h4>" + escapeHtml(label) + "</h4><ul>";
          for (const d of dates) html += "<li>" + escapeHtml(d) + "</li>";
          html += "</ul>";
        }
        list.innerHTML = html;
      } catch (e) {
        list.textContent = "Failed to load.";
      }
    }

    /* ============================================
       BOOKINGS
       ============================================ */
    const API_BOOKINGS = "/.netlify/functions/bookings";

    let bookings = [];
    let bookingsLoaded = false;
    let bookingSort = { key: "createdAt", dir: -1 };
    let bookingSearch = "";
    let bookingFilterPayment = "all";
    let bookingSelection = new Set();

    const BOOKING_COLUMNS = [
      { key: "createdAt", label: "Booked" },
      { key: "eventDate", label: "Event date" },
      { key: "name", label: "Customer" },
      { key: "phone", label: "Phone" },
      { key: "email", label: "Email" },
      { key: "location", label: "Location" },
      { key: "guests", label: "Guests" },
      { key: "items", label: "Items" },
      { key: "total", label: "Total" },
      { key: "payment", label: "Payment" }
    ];

    async function loadBookings(force) {
      if (bookingsLoaded && !force) return;

      const status = document.getElementById("bookingsStatus");
      status.textContent = "⏳ Loading...";
      status.style.color = "var(--color-gray)";

      try {
        const res = await fetch(API_BOOKINGS, {
          headers: { "x-admin-key": adminKey },
          cache: "no-store"
        });

        if (res.status === 401) { logout(); return; }
        if (!res.ok) throw new Error("HTTP " + res.status);

        const data = await res.json();
        bookings = data.bookings || [];
        bookingsLoaded = true;

        const validIds = new Set(bookings.map(function (b) { return b.id; }));
        Array.from(bookingSelection).forEach(function (id) {
          if (!validIds.has(id)) bookingSelection.delete(id);
        });

        status.textContent = "";
        renderBookings();
      } catch (e) {
        status.textContent = "❌ Failed to load bookings";
        status.style.color = "#e63329";
      }
    }

    function getFilteredBookings() {
      const q = bookingSearch.trim().toLowerCase();
      let list = bookings.slice();

      if (bookingFilterPayment !== "all") {
        list = list.filter(function (b) {
          return bookingFilterPayment === "paid"
            ? b.payment === "paid"
            : b.payment !== "paid";
        });
      }

      if (q) {
        list = list.filter(function (b) {
          return [b.name, b.email, b.phone, b.location, b.items, b.address]
            .some(function (v) { return String(v || "").toLowerCase().indexOf(q) !== -1; });
        });
      }

      list.sort(compareBookings);

      return list;
    }

    function compareBookings(a, b) {
      const key = bookingSort.key;
      const dir = bookingSort.dir;

      let va = a[key];
      let vb = b[key];

      if (key === "total") {
        va = Number(va) || 0;
        vb = Number(vb) || 0;
      } else {
        va = String(va || "").toLowerCase();
        vb = String(vb || "").toLowerCase();
      }

      if (va < vb) return -dir;
      if (va > vb) return dir;
      return 0;
    }

    function renderBookings() {
      const tableRoot = document.getElementById("bookingsTable");
      const summary = document.getElementById("bookingsSummary");
      const list = getFilteredBookings();

      const paidTotal = list
        .filter(function (b) { return b.payment === "paid"; })
        .reduce(function (s, b) { return s + (Number(b.total) || 0); }, 0);
      const onsiteTotal = list
        .filter(function (b) { return b.payment !== "paid"; })
        .reduce(function (s, b) { return s + (Number(b.total) || 0); }, 0);

      summary.textContent =
        list.length + " booking" + (list.length === 1 ? "" : "s") +
        " • " + money(paidTotal) + " paid online" +
        " • " + money(onsiteTotal) + " pay on site";

      if (!list.length) {
        tableRoot.innerHTML = '<p style="color:var(--color-gray);">No bookings yet.</p>';
        return;
      }

      const head = BOOKING_COLUMNS.map(function (c) {
        const arrow = bookingSort.key === c.key ? (bookingSort.dir === 1 ? " ▲" : " ▼") : "";
        return '<th class="sortable" data-sort="' + c.key + '">' + c.label + arrow + "</th>";
      }).join("");

      const rows = list.map(function (b) {
        const payLabel = b.payment === "paid" ? "Paid online" : "Pay on site";
        const payClass = b.payment === "paid" ? "pay-tag" : "pay-tag onsite";

        return (
          "<tr>" +
            '<td><input type="checkbox" class="booking-row-check" data-booking-id="' + escapeAttr(b.id) + '"></td>' +
            "<td>" + escapeHtml(formatDateTime(b.createdAt)) + "</td>" +
            "<td>" + escapeHtml(b.eventDate || "—") + "</td>" +
            "<td><strong>" + escapeHtml(b.name || "—") + "</strong></td>" +
            "<td>" + escapeHtml(b.phone || "—") + "</td>" +
            "<td>" + escapeHtml(b.email || "—") + "</td>" +
            "<td>" + escapeHtml(b.location || "—") + "</td>" +
            "<td>" + escapeHtml(b.guests || "—") + "</td>" +
            '<td style="max-width:260px;">' + escapeHtml(String(b.items || "").replace(/\n/g, " · ")) + "</td>" +
            "<td><strong>" + money(Number(b.total) || 0) + "</strong></td>" +
            '<td><span class="' + payClass + '">' + payLabel + "</span></td>" +
            '<td style="white-space:nowrap;">' +
              '<button class="row-btn edit" data-booking-edit="' + escapeAttr(b.id) + '">Edit</button>' +
              '<button class="row-btn del" data-booking-del="' + escapeAttr(b.id) + '">Delete</button>' +
            "</td>" +
          "</tr>"
        );
      }).join("");

      tableRoot.innerHTML =
        '<table class="articles-table bookings-table">' +
          '<thead><tr><th style="width:28px;"><input type="checkbox" id="bookingSelectAll" title="Select all"></th>' +
          head + "<th></th></tr></thead>" +
          "<tbody>" + rows + "</tbody>" +
        "</table>";

      tableRoot.querySelectorAll("[data-sort]").forEach(function (th) {
        th.addEventListener("click", function () {
          const key = th.getAttribute("data-sort");
          if (bookingSort.key === key) {
            bookingSort.dir *= -1;
          } else {
            bookingSort.key = key;
            bookingSort.dir = 1;
          }
          renderBookings();
        });
      });

      tableRoot.querySelectorAll("[data-booking-edit]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          openBookingForm(btn.getAttribute("data-booking-edit"));
        });
      });

      tableRoot.querySelectorAll("[data-booking-del]").forEach(function (btn) {
        btn.addEventListener("click", async function () {
          if (!confirm("Delete this booking? This cannot be undone.")) return;

          const id = btn.getAttribute("data-booking-del");
          try {
            const res = await fetch(API_BOOKINGS, {
              method: "POST",
              headers: { "Content-Type": "application/json", "x-admin-key": adminKey },
              body: JSON.stringify({ action: "delete", id: id })
            });

            if (res.status === 401) { logout(); return; }
            if (!res.ok) throw new Error("HTTP " + res.status);

            bookings = bookings.filter(function (b) { return b.id !== id; });
            bookingSelection.delete(id);
            renderBookings();
          } catch (e) {
            const status = document.getElementById("bookingsStatus");
            status.textContent = "❌ Delete failed";
            status.style.color = "#e63329";
          }
        });
      });

      tableRoot.querySelectorAll(".booking-row-check").forEach(function (box) {
        box.addEventListener("change", function () {
          const id = box.getAttribute("data-booking-id");
          if (box.checked) bookingSelection.add(id);
          else bookingSelection.delete(id);
          updateSelectionUI();
        });
      });

      const selectAll = document.getElementById("bookingSelectAll");
      if (selectAll) {
        selectAll.addEventListener("change", function () {
          const visibleIds = getFilteredBookings().map(function (b) { return b.id; });
          if (selectAll.checked) {
            visibleIds.forEach(function (id) { bookingSelection.add(id); });
          } else {
            visibleIds.forEach(function (id) { bookingSelection.delete(id); });
          }
          updateSelectionUI();
        });
      }

      updateSelectionUI();
    }

    function updateSelectionUI() {
      const list = getFilteredBookings();
      const visibleIds = list.map(function (b) { return b.id; });

      document.querySelectorAll("#bookingsTable .booking-row-check").forEach(function (box) {
        box.checked = bookingSelection.has(box.getAttribute("data-booking-id"));
      });

      const selectAll = document.getElementById("bookingSelectAll");
      if (selectAll) {
        const selectedVisible = visibleIds.filter(function (id) {
          return bookingSelection.has(id);
        }).length;
        selectAll.checked = visibleIds.length > 0 && selectedVisible === visibleIds.length;
        selectAll.indeterminate = selectedVisible > 0 && selectedVisible < visibleIds.length;
      }

      const exportBtn = document.getElementById("exportBookingsBtn");
      if (exportBtn) {
        exportBtn.textContent = bookingSelection.size
          ? "⬇ Export Excel (" + bookingSelection.size + ")"
          : "⬇ Export Excel";
      }

      const summary = document.getElementById("bookingsSummary");
      if (summary) {
        const paidTotal = list
          .filter(function (b) { return b.payment === "paid"; })
          .reduce(function (s, b) { return s + (Number(b.total) || 0); }, 0);
        const onsiteTotal = list
          .filter(function (b) { return b.payment !== "paid"; })
          .reduce(function (s, b) { return s + (Number(b.total) || 0); }, 0);

        summary.textContent =
          list.length + " booking" + (list.length === 1 ? "" : "s") +
          " • " + money(paidTotal) + " paid online" +
          " • " + money(onsiteTotal) + " pay on site" +
          (bookingSelection.size ? " • " + bookingSelection.size + " selected" : "");
      }
    }

    function openBookingForm(id) {
      const booking = id
        ? bookings.find(function (b) { return b.id === id; })
        : null;

      if (id && !booking) return;

      const box = document.getElementById("bookingFormBox");
      box.style.display = "block";

      document.getElementById("bookingFormTitle").textContent = booking
        ? "Edit booking - " + (booking.name || "")
        : "New booking";
      document.getElementById("bk-id").value = booking ? booking.id : "";
      document.getElementById("bk-created").value = booking
        ? toDatetimeLocal(booking.createdAt)
        : toDatetimeLocal(new Date().toISOString());
      document.getElementById("bk-name").value = booking ? booking.name || "" : "";
      document.getElementById("bk-phone").value = booking ? booking.phone || "" : "";
      document.getElementById("bk-email").value = booking ? booking.email || "" : "";
      document.getElementById("bk-eventdate").value = booking ? booking.eventDate || "" : "";
      document.getElementById("bk-address").value = booking ? booking.address || "" : "";
      document.getElementById("bk-location").value = booking ? booking.location || "" : "";
      document.getElementById("bk-guests").value = booking ? booking.guests || "" : "";
      document.getElementById("bk-items").value = booking ? booking.items || "" : "";
      document.getElementById("bk-total").value = booking && booking.total != null ? booking.total : "";
      document.getElementById("bk-payment").value = booking && booking.payment === "pay_on_site" ? "pay_on_site" : "paid";
      document.getElementById("bk-comments").value = booking ? booking.comments || "" : "";
      document.getElementById("bookingFormStatus").textContent = "";

      if (box.scrollIntoView) box.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function toDatetimeLocal(value) {
      if (!value) return "";
      const d = new Date(value);
      if (isNaN(d.getTime())) return "";
      const pad = function (n) { return String(n).padStart(2, "0"); };
      return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
        "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
    }

    async function saveBooking() {
      const status = document.getElementById("bookingFormStatus");
      const id = document.getElementById("bk-id").value;
      const name = document.getElementById("bk-name").value.trim();
      const total = parseFloat(document.getElementById("bk-total").value);

      if (!name) {
        status.textContent = "❌ Customer name is required";
        status.style.color = "#e63329";
        return;
      }
      if (!Number.isFinite(total) || total < 0) {
        status.textContent = "❌ Invalid total";
        status.style.color = "#e63329";
        return;
      }

      const booking = {
        id: id,
        name: name,
        phone: document.getElementById("bk-phone").value.trim(),
        email: document.getElementById("bk-email").value.trim(),
        eventDate: document.getElementById("bk-eventdate").value,
        address: document.getElementById("bk-address").value.trim(),
        location: document.getElementById("bk-location").value.trim(),
        guests: document.getElementById("bk-guests").value.trim(),
        items: document.getElementById("bk-items").value.trim(),
        total: total,
        payment: document.getElementById("bk-payment").value,
        comments: document.getElementById("bk-comments").value.trim()
      };

      const createdValue = document.getElementById("bk-created").value;
      if (createdValue) {
        booking.createdAt = new Date(createdValue).toISOString();
      }

      const action = id ? "update" : "create";

      status.textContent = "⏳ Saving...";
      status.style.color = "var(--color-gray)";

      try {
        const res = await fetch(API_BOOKINGS, {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-admin-key": adminKey },
          body: JSON.stringify({ action: action, booking: booking })
        });

        if (res.status === 401) { logout(); return; }

        if (!res.ok) {
          let message = "Save failed";
          try {
            const data = await res.json();
            message = data.error || message;
          } catch (e) {}
          throw new Error(message);
        }

        const data = await res.json();
        if (id) {
          bookings = bookings.map(function (b) {
            return b.id === data.booking.id ? data.booking : b;
          });
        } else {
          bookings.push(data.booking);
        }

        renderBookings();
        openBookingForm(data.booking.id);

        status.textContent = id ? "✅ Booking updated" : "✅ Booking added";
        status.style.color = "#27ae60";
      } catch (e) {
        status.textContent = "❌ " + (e.message || "Save failed");
        status.style.color = "#e63329";
      }
    }

    function formatDateTime(value) {
      if (!value) return "—";
      const d = new Date(value);
      if (isNaN(d.getTime())) return String(value);
      return d.toLocaleString("en-US", {
        year: "numeric",
        month: "short",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function exportBookingsExcel() {
      const status = document.getElementById("bookingsStatus");

      if (typeof XLSX === "undefined") {
        status.textContent = "❌ Excel library not loaded — check your internet connection";
        status.style.color = "#e63329";
        return;
      }

      let list;
      if (bookingSelection.size) {
        list = bookings.filter(function (b) { return bookingSelection.has(b.id); });
        list.sort(compareBookings);
      } else {
        list = getFilteredBookings();
      }
      if (!list.length) {
        status.textContent = "❌ No bookings to export";
        status.style.color = "#e63329";
        return;
      }

      const rows = list.map(function (b) {
        return {
          "Booking ID": b.id,
          "Booked at": formatDateTime(b.createdAt),
          "Event date": b.eventDate || "",
          "Customer": b.name || "",
          "Phone": b.phone || "",
          "Email": b.email || "",
          "Address": b.address || "",
          "Location": b.location || "",
          "Guests": b.guests || "",
          "Items": String(b.items || "").replace(/\n/g, " | "),
          "Total": Number(b.total) || 0,
          "Payment": b.payment === "paid" ? "Paid online" : "Pay on site",
          "Comments": b.comments || ""
        };
      });

      const ws = XLSX.utils.json_to_sheet(rows);
      ws["!cols"] = [
        { wch: 18 }, { wch: 20 }, { wch: 12 }, { wch: 20 }, { wch: 15 }, { wch: 26 },
        { wch: 28 }, { wch: 20 }, { wch: 8 }, { wch: 50 }, { wch: 10 }, { wch: 14 }, { wch: 40 }
      ];

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Bookings");
      XLSX.writeFile(wb, "mainlinebounce-bookings-" + new Date().toISOString().slice(0, 10) + ".xlsx");

      status.textContent = "✅ Excel file downloaded (" + rows.length + " bookings)";
      status.style.color = "#27ae60";
    }

    /* ============================================
       HELPERS
       ============================================ */
    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }

    function money(value) {
      const n = Number(value) || 0;
      return "$" + (Math.round(n * 100) / 100).toString().replace(/\.00$/, "");
    }

    function slugify(value) {
      return String(value)
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "")
        .slice(0, 40) || "product";
    }

    /* ============================================
       INIT
       ============================================ */
    document.getElementById("loginBtn").addEventListener("click", login);
    document.getElementById("adminKey").addEventListener("keydown", function (e) {
      if (e.key === "Enter") login();
    });
    document.getElementById("logoutBtn").addEventListener("click", logout);
    document.getElementById("saveBannersBtn").addEventListener("click", saveBanners);
    document.getElementById("saveArticleBtn").addEventListener("click", saveArticle);
    document.getElementById("cancelArticleBtn").addEventListener("click", function () {
      document.getElementById("articleFormBox").style.display = "none";
    });
    document.getElementById("newArticleBtn").addEventListener("click", function () {
      openArticleForm(null);
    });

    document.getElementById("saveFaqBtn").addEventListener("click", saveFaq);
    document.getElementById("cancelFaqBtn").addEventListener("click", function () {
      document.getElementById("faqFormBox").style.display = "none";
    });
    document.getElementById("newFaqBtn").addEventListener("click", function () {
      openFaqForm(null);
    });

    document.getElementById("refreshBookingsBtn").addEventListener("click", function () {
      loadBookings(true);
    });
    document.getElementById("newBookingBtn").addEventListener("click", function () {
      openBookingForm(null);
    });
    document.getElementById("exportBookingsBtn").addEventListener("click", exportBookingsExcel);
    document.getElementById("bookingsSearch").addEventListener("input", function (e) {
      bookingSearch = e.target.value;
      renderBookings();
    });
    document.getElementById("bookingsPayment").addEventListener("change", function (e) {
      bookingFilterPayment = e.target.value;
      renderBookings();
    });
    document.getElementById("saveBookingBtn").addEventListener("click", saveBooking);
    document.getElementById("cancelBookingBtn").addEventListener("click", function () {
      document.getElementById("bookingFormBox").style.display = "none";
    });

    document.querySelectorAll(".tab").forEach(function (tab) {
      tab.addEventListener("click", function () {
        document.querySelectorAll(".tab").forEach(function (t) { t.classList.remove("active"); });
        document.querySelectorAll(".tab-panel").forEach(function (p) { p.style.display = "none"; });
        tab.classList.add("active");
        document.getElementById("tab-" + tab.getAttribute("data-tab")).style.display = "block";
      });
    });

    (async function init() {
      if (adminKey) {
        try {
          if (await verifyKey(adminKey)) {
            await enterPanel();
            return;
          }
        } catch (e) {}
        sessionStorage.removeItem("mlb_admin_key");
        adminKey = "";
      }
    })();
  </script>
